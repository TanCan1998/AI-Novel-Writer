name: Commit message CI

# Commit-message hygiene for this fork's own history.
#
# Why a separate workflow instead of another step in pr-ci.yml:
#   - pr-ci.yml sets `paths-ignore` for Markdown/docs-only pull requests, while the
#     2026-10-08 BOM incident happened on a docs-only commit (the D2-c snapshot) —
#     such a pull request would never have run the check at all.
#   - this gate needs no pnpm install, no native modules and no Windows runner,
#     so it stays fast and independent from the desktop build.
#
# Scope: only the commits that a push or pull request adds
# (`before..after` on push, `base..HEAD` on pull_request). `workflow_dispatch` takes an
# explicit `range` input for manual audits; an empty input means nothing to check.
#
# Upstream history imported from EthanYoQ/AI-Novel-Writer is deliberately not audited —
# it contains plenty of pre-convention subjects (38 commits when this check was added).
# Upstream history imported from EthanYoQ/AI-Novel-Writer is never audited, on any event:
# `UPSTREAM_IGNORE_AUTHORS` below is applied to push / pull_request / workflow_dispatch alike,
# so merging upstream/master into this fork cannot turn the push run red. Extra addresses can
# still be added ad hoc via the `ignore_authors` dispatch input (or `--ignore-author <email>`
# when running the script locally).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      range:
        description: 'Revision range to audit, e.g. d973c19..HEAD (empty = nothing to check)'
        required: false
        default: ''
        type: string
      ignore_authors:
        description: 'Comma-separated author emails to skip (upstream history)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: commit-message-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DISPATCH_RANGE: ${{ inputs.range }}
          DISPATCH_IGNORE_AUTHORS: ${{ inputs.ignore_authors }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request)
              range="${PR_BASE_SHA}..HEAD"
              ;;
            push)
              if [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                echo "Initial push of ${PUSH_AFTER}; nothing to range-check."
                exit 0
              fi
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
              ;;
            workflow_dispatch)
              range="${DISPATCH_RANGE}"
              if [ -z "${range}" ]; then
                echo "workflow_dispatch without a 'range' input: nothing to check."
                echo "Re-run this workflow with range = origin/master..HEAD (or any A..B range)."
                exit 0
              fi
              ;;
            *)
              echo "No automatic range for ${EVENT_NAME}; run"
              echo "  node scripts/check-commit-msg.mjs --range <base>..HEAD"
              echo "manually when needed."
              exit 0
              ;;
          esac

          base_sha="${range%%..*}"
          if ! git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null; then
            echo "::warning::Base commit ${base_sha} is unavailable (force-push or garbage collection); skipping the check."
            exit 0
          fi

          # Upstream history is deliberately exempt (see the header comment); this list is applied to
          # every event, and the workflow_dispatch input is appended on top of it.
          UPSTREAM_IGNORE_AUTHORS="257484394+EthanYoQ@users.noreply.github.com"

          node_args=(scripts/check-commit-msg.mjs --range "${range}")
          combined_authors="${UPSTREAM_IGNORE_AUTHORS},${DISPATCH_IGNORE_AUTHORS}"
          # Emails carry no whitespace, so stripping every blank is a safe trim.
          IFS=',' read -r -a raw_authors <<< "${combined_authors}"
          for author in "${raw_authors[@]}"; do
            author="${author//[[:space:]]/}"
            if [ -n "${author}" ]; then
              node_args+=(--ignore-author "${author}")
            fi
          done
          echo "Range under check: ${range}"
          node "${node_args[@]}"
