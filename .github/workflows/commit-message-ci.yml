name: Commit message CI

# Commit-message hygiene for this fork's own history.
#
# Why a separate workflow instead of another step in pr-ci.yml:
#   - pr-ci.yml sets `paths-ignore` for Markdown/docs-only pull requests, while the
#     2026-10-08 BOM incident happened on a docs-only commit (the D2-c snapshot) —
#     such a pull request would never have run the check at all.
#   - this gate needs no pnpm install, no native modules and no Windows runner,
#     so it stays fast and independent from the desktop build.
#
# Scope: only the commits that a push or pull request adds
# (`before..after` on push, `base..HEAD` on pull_request). Upstream history imported
# from EthanYoQ/AI-Novel-Writer is deliberately not audited — it contains plenty of
# pre-convention subjects. If a branch merges upstream and drags those commits into
# the range, add `--ignore-author <email>` to the invocation below.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-message-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request)
              range="${PR_BASE_SHA}..HEAD"
              ;;
            push)
              if [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                echo "Initial push of ${PUSH_AFTER}; nothing to range-check."
                exit 0
              fi
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
              ;;
            *)
              echo "No automatic range for ${EVENT_NAME}; run"
              echo "  node scripts/check-commit-msg.mjs --range <base>..HEAD"
              echo "manually when needed."
              exit 0
              ;;
          esac

          base_sha="${range%%..*}"
          if ! git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null; then
            echo "::warning::Base commit ${base_sha} is unavailable (force-push or garbage collection); skipping the check."
            exit 0
          fi

          echo "Range under check: ${range}"
          node scripts/check-commit-msg.mjs --range "${range}"
