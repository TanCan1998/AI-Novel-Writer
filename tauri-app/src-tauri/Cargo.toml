[package]
name = "ai-novel-writer"
version = "1.1.0"
description = "AI Novel Writer — 本地优先的长篇小说创作工作台（Tauri 2 后端）"
edition = "2021"

# 迁移自 Electron 主进程（electron/）。迁移期间 Electron 保留可运行，
# 本 crate 仅承载 Tauri 侧实现；分层映射见 docs/agents/pi-development.md。

[lib]
# lib.rs 独立于 main.rs，便于桌面/移动端复用与单元测试。
name = "ai_novel_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 角色名单/蓝图/定稿的规范 JSON 哈希（SHA-256 小写 hex）。
# 已随 tauri 依赖树存在于 Cargo.lock（0.10.9），声明为直接依赖不产生任何新下载。
sha2 = "0.10"

# 按需引入（不提前加，避免无用编译）：
# - rusqlite（bundled feature，避免依赖系统 sqlite）→ 批次 C 数据库层
# - reqwest                                 → 批次 D LLM 适配
# - tauri-plugin-{fs,updater,shell,notification} → 批次 B/H 按频道批准

[profile.dev]
incremental = true
